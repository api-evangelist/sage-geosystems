aid: sage-geosystems
name: Sage Geosystems
description: >-
  Sage Geosystems is a Houston, Texas energy company developing "Pressure Geothermal" — an evolution
  of traditional geothermal that applies subsurface breakthroughs from the oil and gas industry to
  hot dry rock. Its two-well Power Generation system circulates water through engineered "lung"
  fractures and extracts heat at surface through a heat exchanger driving an sCO2 turbine, while its
  single-well EarthStore energy storage system charges and discharges over 8-hour to multi-day
  timescales for long-duration storage. The company markets to utilities, data centers and
  government partners rather than to developers: as of this profile it operates a seven-page
  marketing site with no developer portal, public API, SDK, or machine-readable specification of any
  kind.
